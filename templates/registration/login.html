{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Bemoria</title><link rel="stylesheet" href="{% static 'health/app.css' %}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="/">◉ <span>Bemoria</span></a>
    <h1>Bem-vindo de volta</h1><p class="muted">Entre para acessar sua organização de saúde.</p>
    {% if form.errors %}<p class="form-error">E-mail ou senha inválidos. Tente novamente.</p>{% endif %}
    <form method="post">{% csrf_token %}
      <label for="id_username">E-mail ou usuário</label>{{ form.username }}
      <label for="id_password">Senha</label>{{ form.password }}
      <button class="button primary full" type="submit">Entrar</button>
    </form>
    <p class="tiny muted">Ainda não tem conta? <a class="link" href="{% url 'register-page' %}">Criar cadastro</a></p>
  </main>
</body>
</html>
