{% load static %}<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha · Bemoria</title><link rel="stylesheet" href="{% static 'health/app.css' %}"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="{% url 'login' %}"><span class="brand-mark">✳</span>bemoria<span class="brand-dot">.</span></a><h1>Vamos recuperar o acesso.</h1><p>Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos as instruções.</p><form method="post">{% csrf_token %}<label for="id_email">E-mail</label>{{ form.email }}{% for error in form.email.errors %}<span class="field-error">{{ error }}</span>{% endfor %}<button class="button primary full" type="submit">Enviar instruções</button></form><p class="tiny"><a href="{% url 'login' %}">Voltar para entrar</a></p></main></body></html>
